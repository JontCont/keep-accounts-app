name: PR Build Check

on:
  pull_request:
    branches: [ master ]

jobs:
  release-version:
    name: Verify release version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a version increment
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          version_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          base_version="$(git show "${BASE_SHA}:.github/workflows/build-app.yml" | sed -nE 's/^  APP_VERSION: ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p')"
          head_version="$(sed -nE 's/^  APP_VERSION: ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' .github/workflows/build-app.yml)"

          if ! [[ "$base_version" =~ $version_pattern ]]; then
            echo "The master APP_VERSION is not a valid semantic version: $base_version"
            exit 1
          fi

          if ! [[ "$head_version" =~ $version_pattern ]]; then
            echo "APP_VERSION must use major.minor.patch, for example 0.1.1."
            exit 1
          fi

          if [ "$base_version" = "$head_version" ] || \
             [ "$(printf '%s\n%s\n' "$base_version" "$head_version" | sort -V | tail -n 1)" != "$head_version" ]; then
            echo "APP_VERSION must be greater than the master version ($base_version)."
            exit 1
          fi

          echo "Version increment verified: $base_version -> $head_version"

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx nx run @keep-accounts-app/web:lint

      - name: Test
        run: npx nx run @keep-accounts-app/web:test

      - name: Build Web Application
        run: npx nx run @keep-accounts-app/web:build
