name: Mobile Builds CI

env:
  APP_VERSION: 0.2.0

on:
  push:
    branches: [develop, master]

jobs:
  # Stage 1: Build & verify once. This job gates all packaging jobs below.
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compute version
        id: version
        run: echo "version=$(date +'%Y%m%d')-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx nx run @keep-accounts-app/web:lint

      - name: Test
        run: npx nx run @keep-accounts-app/web:test

      - name: Build Web Application
        run: npx nx run @keep-accounts-app/web:build

      - name: Upload Web Build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 1

  # Stage 2a: Package Android from the shared web build.
  package-android:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Install dependencies
        run: npm ci

      - name: Download Web Build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

      - name: Install Capacitor Assets
        run: npm install -D @capacitor/assets

      - name: Generate App Icons for Android
        run: npx capacitor-assets generate --android --iconBackgroundColor '#312E81' --iconBackgroundColorDark '#312E81'
        working-directory: apps/web

      - name: Sync Capacitor Android
        run: npx cap sync android
        working-directory: apps/web

      - name: Assemble Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
        working-directory: apps/web/android

      - name: Name Android APK
        env:
          APK_FILE: ${{ needs.build.outputs.version }}.apk
        run: mv apps/web/android/app/build/outputs/apk/debug/app-debug.apk "$APK_FILE"

      - name: Upload Android APK for publishing
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ needs.build.outputs.version }}.apk
          retention-days: 1

  # Stage 2b: Package iOS from the shared web build.
  package-ios:
    needs: build
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download Web Build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

      - name: Install Capacitor Assets
        run: npm install -D @capacitor/assets

      - name: Generate App Icons for iOS
        run: npx capacitor-assets generate --ios --iconBackgroundColor '#312E81' --iconBackgroundColorDark '#312E81'
        working-directory: apps/web

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: apps/web/ios/App/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('apps/web/ios/App/Podfile') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Sync Capacitor iOS
        run: npx cap sync ios
        working-directory: apps/web

      - name: Install CocoaPods dependencies
        run: pod install --repo-update
        working-directory: apps/web/ios/App

      - name: Build iOS App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Debug -destination generic/platform=iOS \
            CODE_SIGNING_ALLOWED=NO -derivedDataPath build
        working-directory: apps/web/ios/App

      - name: Package iOS IPA
        env:
          IPA_FILE: ${{ needs.build.outputs.version }}.ipa
        run: |
          mkdir Payload
          cp -r apps/web/ios/App/build/Build/Products/Debug-iphoneos/App.app Payload/
          zip -r "$IPA_FILE" Payload

      - name: Upload iOS IPA for publishing
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ needs.build.outputs.version }}.ipa
          retention-days: 1

  # Stage 3: Only publish master builds as GitHub Release downloads.
  publish-mobile-build:
    if: github.ref == 'refs/heads/master'
    needs: [build, package-android, package-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: release-assets

      - name: Generate release changelog
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          previous_tag=""
          while IFS= read -r candidate_tag; do
            if [ "$(git rev-list -n 1 "$candidate_tag")" != "$GITHUB_SHA" ]; then
              previous_tag="$candidate_tag"
              break
            fi
          done < <(git tag --merged "$GITHUB_SHA" --list 'build-*' --sort=-creatordate)

          if [ -z "$previous_tag" ]; then
            previous_tag="$(git tag --merged "$GITHUB_SHA" --list 'v[0-9]*' --sort=-creatordate | head -n 1)"
          fi

          {
            echo "## 記帳 App v${APP_VERSION}"
            echo
            echo "Build: ${RELEASE_VERSION}"
            echo
            if [ -n "$previous_tag" ]; then
              echo "Changes since [${previous_tag}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${previous_tag}...${GITHUB_SHA}):"
              echo
              git log --no-merges --reverse --format='%H%x09%s' "${previous_tag}..${GITHUB_SHA}" |
                while IFS=$'\t' read -r commit subject; do
                  printf '%s\n' "- ${subject} ([${commit:0:7}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${commit}))"
                done
            else
              echo "Initial automated build."
            fi
          } > release-assets/CHANGELOG.md

      - name: Publish mobile build release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ needs.build.outputs.version }}
          name: v${{ env.APP_VERSION }} - 記帳 App
          prerelease: true
          body_path: release-assets/CHANGELOG.md
          files: |
            release-assets/${{ needs.build.outputs.version }}.apk
            release-assets/${{ needs.build.outputs.version }}.ipa

      - name: Remove expired mobile build releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff="$(date -u --date='10 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          gh release list --limit 1000 --json tagName,createdAt,isPrerelease \
            --jq ".[] | select(.isPrerelease and (.tagName | startswith(\"build-\")) and (.createdAt < \"$cutoff\")) | .tagName" |
            while IFS= read -r tag; do
              [ -n "$tag" ] && gh release delete "$tag" --cleanup-tag --yes
            done
